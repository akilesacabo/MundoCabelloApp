<!doctype html>
<html lang="es">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Clientes · Mundo del Cabello</title><link rel="stylesheet" href="styles.css?v=20260809"></head>
<body class="modern-page top-nav-page">
  <div class="app-shell">
    <aside class="app-sidebar">
      <a class="dashboard-logo" href="admin.html"><span class="logo-mark">M</span><span><b>Mundo</b><small>del Cabello</small></span></a>
      <nav class="site-nav dashboard-nav" aria-label="Navegación principal"></nav>
      <div class="sidebar-profile"><div class="profile-avatar">AD</div><div><b>Administración</b><small>Base de clientes</small></div><button onclick="logout()">↗</button></div>
    </aside>
    <div class="app-content"><main class="app-main">
      <div class="page-heading"><span class="section-kicker">BASE DE CLIENTES</span><h1>Clientes registrados</h1><p class="muted">Consulta la lista completa y abre cualquier fila para revisar su historial.</p></div>
      <div class="filter-bar client-table-tools"><div class="search-field"><span>⌕</span><input id="clientSearch" type="search" placeholder="Buscar por nombre, cédula o teléfono"></div><button type="button" class="secondary" onclick="downloadClients()">Descargar para Excel</button><span id="clientCount" class="result-count"></span></div>
      <section class="client-table-card" aria-live="polite">
        <div class="client-table-scroll">
          <table class="client-table">
            <thead><tr><th>Nombre</th><th>Cédula</th><th>Teléfono</th><th>Visitas</th><th>Última visita</th><th>Turno activo</th><th></th></tr></thead>
            <tbody id="clientList"><tr><td colspan="7">Cargando clientes…</td></tr></tbody>
          </table>
        </div>
        <div id="clientPagination" class="table-pagination"></div>
      </section>
    </main></div>
  </div>
  <div id="clientModal" class="modal-backdrop" hidden onclick="if(event.target===this)closeClient()">
    <section class="edit-modal client-history-modal" role="dialog" aria-modal="true" aria-labelledby="clientModalTitle">
      <div class="modal-heading">
        <div><span class="section-kicker">FICHA DEL CLIENTE</span><h2 id="clientModalTitle">Historial</h2></div>
        <button class="close-button" type="button" onclick="closeClient()" aria-label="Cerrar">×</button>
      </div>
      <div id="clientDetail" aria-live="polite"></div>
    </section>
  </div>
  <script src="api.js?v=20260808"></script>
  <script>
    let clients=[],page=1;
    const PAGE_SIZE=25;
    const normalize=value=>String(value).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
    const escapeHtml=value=>String(value).replace(/[&<>'"]/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[char]));
    const stateLabels={en_espera:'En espera',en_atencion:'En atención',reposo:'En reposo',finalizado:'Finalizado',pendiente:'Pendiente'};
    const situationLabels={presente:'Presente',ausente:'Ausente',estafa:'Estafa'};
    const formatDate=value=>new Intl.DateTimeFormat('es-VE',{dateStyle:'medium',timeStyle:'short'}).format(new Date(value));
    function filteredClients(){
      const term=normalize(clientSearch.value);
      return clients.filter(client=>normalize(`${client.nombre} ${client.cedula} ${client.telefono}`).includes(term));
    }
    function render(){
      const rows=filteredClients();
      const pages=Math.max(1,Math.ceil(rows.length/PAGE_SIZE));page=Math.min(page,pages);
      const visible=rows.slice((page-1)*PAGE_SIZE,page*PAGE_SIZE);
      clientCount.textContent=`${rows.length} de ${clients.length}`;
      clientList.innerHTML=visible.length?visible.map(client=>`
        <tr>
          <td><b>${escapeHtml(client.nombre)}</b><small>${escapeHtml(client.direccion)}</small></td>
          <td>${escapeHtml(client.cedula)}</td>
          <td>${escapeHtml(client.telefono)}</td>
          <td>${client.visitas}</td>
          <td>${client.ultima_visita?new Date(client.ultima_visita).toLocaleDateString('es-VE'):'Sin visitas'}</td>
          <td>${client.active_turno?`<span class="status-pill">#${client.active_turno}</span>`:'—'}</td>
          <td><button class="secondary table-action" type="button" onclick="openClient(${client.id})">Ver historial</button></td>
        </tr>`).join(''):'<tr><td colspan="7"><div class="empty-state"><b>No hay clientes registrados</b><p class="muted">Prueba con otra búsqueda.</p></div></td></tr>';
      clientPagination.innerHTML=rows.length>PAGE_SIZE?`<button class="secondary" type="button" onclick="changePage(-1)" ${page===1?'disabled':''}>← Anterior</button><span>Página ${page} de ${pages}</span><button class="secondary" type="button" onclick="changePage(1)" ${page===pages?'disabled':''}>Siguiente →</button>`:'';
    }
    function changePage(delta){page+=delta;render()}
    function csvCell(value){
      let text=String(value??'');if(/^[=+\-@]/.test(text))text=`'${text}`;
      return `"${text.replaceAll('"','""')}"`;
    }
    function downloadClients(){
      const rows=filteredClients();
      const header=['Nombre','Cédula','Teléfono','Dirección','Visitas','Última visita','Turno activo'];
      const body=rows.map(client=>[client.nombre,client.cedula,client.telefono,client.direccion,client.visitas,client.ultima_visita?new Date(client.ultima_visita).toLocaleDateString('es-VE'):'',client.active_turno||'']);
      const csv='\ufeff'+[header,...body].map(row=>row.map(csvCell).join(',')).join('\r\n');
      const url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));const link=document.createElement('a');
      link.href=url;link.download=`clientes-registrados-${new Date().toISOString().slice(0,10)}.csv`;link.click();URL.revokeObjectURL(url);
    }
    function renderService(service){
      const specialist=service.especialista
        ?`#${service.staff_numero} ${escapeHtml(service.especialista)}`
        :'<span class="muted">Sin asignar</span>';
      return `<li class="history-service">
        <div><b>${escapeHtml(service.nombre)}</b><small>${escapeHtml(service.area_key)} · ${specialist}</small></div>
        <div class="history-service-state"><span class="status-pill">${escapeHtml(stateLabels[service.estado]||service.estado)}</span><b>$${Number(service.precio_usd).toFixed(2)}</b></div>
      </li>`;
    }
    function renderVisit(visit){
      const tags=visit.etiquetas.length?visit.etiquetas.map(code=>`<span class="tag">${escapeHtml(code)}</span>`).join(''):'<span class="muted">Sin etiquetas</span>';
      return `<article class="history-visit">
        <header><div><span class="client-turn">TURNO #${visit.turno}</span><h3>${formatDate(visit.created_at)}</h3></div><div class="visit-statuses"><span class="status-pill">${escapeHtml(stateLabels[visit.estado]||visit.estado)}</span><span class="status-pill status-${visit.situacion}">${escapeHtml(situationLabels[visit.situacion]||visit.situacion)}</span></div></header>
        <div class="tag-actions">${tags}</div>
        <p class="history-registrar"><b>Registrado por:</b> ${escapeHtml(visit.registrado_por_nombre||'Usuario no registrado')}</p>
        ${visit.observacion?`<p class="history-observation"><b>Observación:</b> ${escapeHtml(visit.observacion)}</p>`:'<p class="history-observation muted">Sin observaciones</p>'}
        <ul class="history-services">${visit.servicios.map(renderService).join('')}</ul>
      </article>`;
    }
    async function openClient(profileId){
      clientModal.hidden=false;
      clientDetail.innerHTML='<div class="history-loading">Cargando historial…</div>';
      try{
        const client=await api(`/queue/clients/${profileId}`);
        clientModalTitle.textContent=client.nombre;
        clientDetail.innerHTML=`
          <div class="history-profile">
            <span><b>Cédula</b>${escapeHtml(client.cedula)}</span>
            <span><b>Teléfono</b>${escapeHtml(client.telefono)}</span>
            <span><b>Dirección</b>${escapeHtml(client.direccion)}</span>
            <span><b>Visitas</b>${client.visitas.length}</span>
          </div>
          <div class="history-heading"><h3>Historial de visitas</h3><span>${client.visitas.length} registro${client.visitas.length===1?'':'s'}</span></div>
          <div class="history-timeline">${client.visitas.length?client.visitas.map(renderVisit).join(''):'<div class="empty-state"><p>Este cliente aún no tiene visitas.</p></div>'}</div>`;
      }catch(error){
        clientDetail.innerHTML=`<div class="empty-state"><h3>No fue posible cargar la ficha</h3><p>${escapeHtml(error.message)}</p></div>`;
      }
    }
    function closeClient(){clientModal.hidden=true}
    document.addEventListener('keydown',event=>{if(event.key==='Escape')closeClient()});
    clientSearch.oninput=()=>{page=1;render()};async function load(){try{clients=await api('/queue/clients');render()}catch(error){clientList.innerHTML=`<tr><td colspan="7">${escapeHtml(error.message)}</td></tr>`}}load();
  </script>
</body>
</html>
