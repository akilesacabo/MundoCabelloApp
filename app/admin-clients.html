<!doctype html>
<html lang="es">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Clientes · Mundo del Cabello</title><link rel="stylesheet" href="styles.css"></head>
<body class="modern-page top-nav-page">
  <div class="app-shell">
    <aside class="app-sidebar">
      <a class="dashboard-logo" href="admin.html"><span class="logo-mark">M</span><span><b>Mundo</b><small>del Cabello</small></span></a>
      <nav class="site-nav dashboard-nav" aria-label="Navegación principal"></nav>
      <div class="sidebar-profile"><div class="profile-avatar">AD</div><div><b>Administración</b><small>Base de clientes</small></div><button onclick="logout()">↗</button></div>
    </aside>
    <div class="app-content"><main class="app-main">
      <div class="page-heading"><span class="section-kicker">BASE DE CLIENTES</span><h1>Clientes registrados</h1><p class="muted">Una ficha por cédula, con sus datos actuales y resumen de visitas.</p></div>
      <div class="filter-bar"><div class="search-field"><span>⌕</span><input id="clientSearch" type="search" placeholder="Buscar por nombre, cédula o teléfono"></div><span id="clientCount" class="result-count"></span></div>
      <section id="clientList" class="client-database" aria-live="polite"></section>
    </main></div>
  </div>
  <div id="clientModal" class="modal-backdrop" hidden onclick="if(event.target===this)closeClient()">
    <section class="edit-modal client-history-modal" role="dialog" aria-modal="true" aria-labelledby="clientModalTitle">
      <div class="modal-heading">
        <div><span class="section-kicker">FICHA DEL CLIENTE</span><h2 id="clientModalTitle">Historial</h2></div>
        <button class="close-button" type="button" onclick="closeClient()" aria-label="Cerrar">×</button>
      </div>
      <div id="clientDetail" aria-live="polite"></div>
    </section>
  </div>
  <script src="api.js"></script>
  <script>
    let clients=[];
    const normalize=value=>String(value).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
    const escapeHtml=value=>String(value).replace(/[&<>'"]/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[char]));
    const stateLabels={en_espera:'En espera',en_atencion:'En atención',finalizado:'Finalizado',pendiente:'Pendiente'};
    const situationLabels={presente:'Presente',ausente:'Ausente',estafa:'Estafa'};
    const formatDate=value=>new Intl.DateTimeFormat('es-VE',{dateStyle:'medium',timeStyle:'short'}).format(new Date(value));
    function render(){
      const term=normalize(clientSearch.value);
      const rows=clients.filter(client=>normalize(`${client.nombre} ${client.cedula} ${client.telefono}`).includes(term));
      clientCount.textContent=`${rows.length} de ${clients.length}`;
      clientList.innerHTML=rows.length?rows.map(client=>`
        <article class="card client-profile-card">
          <span class="tag">${client.visitas} visita${client.visitas===1?'':'s'}</span>
          <h2>${escapeHtml(client.nombre)}</h2>
          <div class="profile-contact">
            <span><b>Cédula:</b> ${escapeHtml(client.cedula)}</span>
            <span><b>Teléfono:</b> ${escapeHtml(client.telefono)}</span>
            <span><b>Dirección:</b> ${escapeHtml(client.direccion)}</span>
            <span><b>Última visita:</b> ${client.ultima_visita?new Date(client.ultima_visita).toLocaleDateString('es-VE'):'Sin visitas'}</span>
          </div>
          <div class="tag-actions">${client.etiquetas.length?client.etiquetas.map(code=>`<span class="tag">${escapeHtml(code)}</span>`).join(''):'<span class="muted">Sin etiquetas recientes</span>'}</div>
          <button class="secondary client-history-button" type="button" onclick="openClient(${client.id})">Ver ficha e historial</button>
        </article>`).join(''):'<div class="card empty-state"><h2>No hay clientes registrados</h2><p class="muted">Los perfiles aparecerán después del primer check-in.</p></div>';
    }
    function renderService(service){
      const specialist=service.especialista
        ?`#${service.staff_numero} ${escapeHtml(service.especialista)}`
        :'<span class="muted">Sin asignar</span>';
      return `<li class="history-service">
        <div><b>${escapeHtml(service.nombre)}</b><small>${escapeHtml(service.area_key)} · ${specialist}</small></div>
        <div class="history-service-state"><span class="status-pill">${escapeHtml(stateLabels[service.estado]||service.estado)}</span><b>$${Number(service.precio_usd).toFixed(2)}</b></div>
      </li>`;
    }
    function renderVisit(visit){
      const tags=visit.etiquetas.length?visit.etiquetas.map(code=>`<span class="tag">${escapeHtml(code)}</span>`).join(''):'<span class="muted">Sin etiquetas</span>';
      return `<article class="history-visit">
        <header><div><span class="client-turn">TURNO #${visit.turno}</span><h3>${formatDate(visit.created_at)}</h3></div><div class="visit-statuses"><span class="status-pill">${escapeHtml(stateLabels[visit.estado]||visit.estado)}</span><span class="status-pill status-${visit.situacion}">${escapeHtml(situationLabels[visit.situacion]||visit.situacion)}</span></div></header>
        <div class="tag-actions">${tags}</div>
        ${visit.observacion?`<p class="history-observation"><b>Observación:</b> ${escapeHtml(visit.observacion)}</p>`:'<p class="history-observation muted">Sin observaciones</p>'}
        <ul class="history-services">${visit.servicios.map(renderService).join('')}</ul>
      </article>`;
    }
    async function openClient(profileId){
      clientModal.hidden=false;
      clientDetail.innerHTML='<div class="history-loading">Cargando historial…</div>';
      try{
        const client=await api(`/queue/clients/${profileId}`);
        clientModalTitle.textContent=client.nombre;
        clientDetail.innerHTML=`
          <div class="history-profile">
            <span><b>Cédula</b>${escapeHtml(client.cedula)}</span>
            <span><b>Teléfono</b>${escapeHtml(client.telefono)}</span>
            <span><b>Dirección</b>${escapeHtml(client.direccion)}</span>
            <span><b>Visitas</b>${client.visitas.length}</span>
          </div>
          <div class="history-heading"><h3>Historial de visitas</h3><span>${client.visitas.length} registro${client.visitas.length===1?'':'s'}</span></div>
          <div class="history-timeline">${client.visitas.length?client.visitas.map(renderVisit).join(''):'<div class="empty-state"><p>Este cliente aún no tiene visitas.</p></div>'}</div>`;
      }catch(error){
        clientDetail.innerHTML=`<div class="empty-state"><h3>No fue posible cargar la ficha</h3><p>${escapeHtml(error.message)}</p></div>`;
      }
    }
    function closeClient(){clientModal.hidden=true}
    document.addEventListener('keydown',event=>{if(event.key==='Escape')closeClient()});
    clientSearch.oninput=render;async function load(){try{clients=await api('/queue/clients');render()}catch(error){clientList.textContent=error.message}}load();
  </script>
</body>
</html>
