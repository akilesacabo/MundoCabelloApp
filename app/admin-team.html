<!doctype html>
<html lang="es">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Estado del equipo · Mundo del Cabello</title><link rel="stylesheet" href="styles.css?v=20260810"></head>
<body class="modern-page top-nav-page">
  <div class="app-shell">
    <aside class="app-sidebar">
      <a class="dashboard-logo" href="admin.html"><span class="logo-mark">M</span><span><b>Mundo</b><small>del Cabello</small></span></a>
      <nav class="site-nav dashboard-nav" aria-label="Navegación principal"></nav>
      <div class="sidebar-profile"><div class="profile-avatar">AD</div><div><b>Administración</b><small>Estado del equipo</small></div><button onclick="logout()">↗</button></div>
    </aside>
    <div class="app-content"><main class="app-main">
      <div class="page-heading"><span class="section-kicker">EQUIPO EN VIVO</span><h1>Estado de especialistas</h1><p class="muted">Consulta la carga de trabajo y cambia la disponibilidad sin salir de esta pantalla.</p></div>
      <div class="stats-strip"><div class="stat-chip"><span>Disponibles</span><b id="availableCount">—</b></div><div class="stat-chip"><span>Ocupados</span><b id="busyCount">—</b></div><div class="stat-chip"><span>En pausa</span><b id="breakCount">—</b></div></div>
      <div class="filter-bar team-filter-bar"><div class="search-field"><span>⌕</span><input id="teamSearch" type="search" placeholder="Buscar especialista o cliente" autocomplete="off"></div><select id="areaFilter" aria-label="Filtrar por área"><option value="">Todas las áreas</option></select><select id="statusFilter"><option value="">Todos los estados</option><option value="disponible">Disponibles</option><option value="ocupado">Ocupados</option><option value="break">En pausa</option><option value="almorzando">Almorzando</option></select><span id="teamCount" class="result-count"></span></div>
      <section id="teamList" class="team-status-list" aria-live="polite"></section>
    </main></div>
  </div>
  <div id="toast" class="toast" hidden></div>
  <script src="api.js?v=20260808"></script>
  <script>
    const labels={disponible:'Disponible',ocupado:'Ocupado',break:'En pausa'},areaLabels={peluqueria:'Peluquería',hidratacion:'Hidratación',head_spa:'Head Spa',manicure:'Manicure y Pedicure',cejas:'Cejas y depilación',maquillaje:'Maquillaje'};let staff=[];
    const normalize=value=>String(value).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
    const escapeHtml=value=>String(value).replace(/[&<>'"]/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[char]));
    function notify(message){toast.textContent=message;toast.hidden=false;clearTimeout(notify.timer);notify.timer=setTimeout(()=>toast.hidden=true,2400)}
    async function changeStatus(numero,value){try{const updated=await api(`/staff/${numero}/manual-status`,{method:'PATCH',body:JSON.stringify({manual_status:value})});notify(updated.status==='ocupado'&&value==='disponible'?'Sigue ocupado porque tiene servicios activos.':'Estado actualizado.');await load()}catch(error){notify(error.message)}}
    function render(){
      const term=normalize(teamSearch.value),status=statusFilter.value,area=areaFilter.value;
      const rows=staff.filter(person=>(!status||person.status===status)&&(!area||person.areas.includes(area))&&(!term||[person.alias,person.nombre,...person.activos.map(item=>item.cliente)].some(value=>normalize(value).startsWith(term))));
      availableCount.textContent=staff.filter(person=>person.status==='disponible').length;busyCount.textContent=staff.filter(person=>person.status==='ocupado').length;breakCount.textContent=staff.filter(person=>person.status==='break').length;teamCount.textContent=`${rows.length} de ${staff.length}`;
      teamList.innerHTML=rows.length?rows.map(person=>`<article class="card team-status-card ${person.en_prueba?'trial-specialist':''}"><div class="staff-status-head"><div class="staff-avatar">${escapeHtml(person.initials)}</div><div class="staff-copy"><b>#${person.numero} · ${escapeHtml(person.alias)} ${person.en_prueba?'<span class="trial-badge">EN PRUEBA</span>':''}</b><span>${person.areas.map(area=>escapeHtml(areaLabels[area]||area)).join(' · ')}</span>${person.preseleccion_count?`<small class="preselection-count">★ Preseleccionada por ${person.preseleccion_count} cliente${person.preseleccion_count===1?'':'s'}</small>`:''}</div><select class="status-select status-${person.status}" aria-label="Estado de ${escapeHtml(person.alias)}" onchange="changeStatus(${person.numero},this.value)"><option value="disponible" ${person.manual_status==='disponible'?'selected':''}>Disponible</option><option value="ocupado" ${person.manual_status==='ocupado'?'selected':''}>Ocupado</option><option value="break" ${person.manual_status==='break'?'selected':''}>En pausa</option><option value="almorzando" ${person.manual_status==='almorzando'?'selected':''}>Almorzando</option></select></div>${person.activos.length?`<div class="active-client-list"><b>Carga actual</b>${person.activos.map(item=>`<div><span class="mini-pill status-${item.estado}">${item.estado==='reposo'?'En reposo':'Atendiendo'}</span> Turno #${item.turno} · ${escapeHtml(item.cliente)} · ${escapeHtml(item.servicio)}</div>`).join('')}</div>`:'<div class="active-client-list muted">Sin servicios activos.</div>'}</article>`).join(''):'<div class="card empty-state"><h2>Sin coincidencias</h2><p class="muted">Cambia el filtro o la búsqueda.</p></div>';
    }
    teamSearch.oninput=render;statusFilter.onchange=render;areaFilter.onchange=render;
    async function load(){try{staff=await api('/staff');const areas=[...new Set(staff.flatMap(person=>person.areas))].sort();const selected=areaFilter.value;areaFilter.innerHTML=`<option value="">Todas las áreas</option>${areas.map(area=>`<option value="${escapeHtml(area)}">${escapeHtml(areaLabels[area]||area)}</option>`).join('')}`;areaFilter.value=selected;render()}catch(error){teamList.textContent=error.message}}
    load();setInterval(load,10000);
  </script>
</body>
</html>
