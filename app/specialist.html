<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width">
  <title>Mis clientes</title>
  <link rel="stylesheet" href="styles.css?v=20260729">
</head>
<body class="modern-page"><div class="app-shell"><aside class="app-sidebar"><a class="dashboard-logo" href="specialist.html"><span class="logo-mark">M</span><span><b>Mundo</b><small>del Cabello</small></span></a><nav class="site-nav dashboard-nav" aria-label="Navegación principal"><a class="active" href="specialist.html"><span>◎</span>Mis clientes</a><a href="checkin.html"><span>＋</span>Check-in</a><a href="queue.html"><span>◉</span>Cola pública</a></nav><div class="sidebar-profile"><div class="profile-avatar">ES</div><div><b>Especialista</b><small>Agenda activa</small></div><button onclick="logout()" title="Cerrar sesión">↗</button></div></aside><div class="app-content"><header class="app-topbar"><div class="app-topbar-copy"><b>Tu espacio de trabajo</b><span>Servicios asignados y pendientes</span></div><span class="live-indicator"><span></span>Actualización automática</span></header><main class="app-main"><div class="page-heading"><div><span class="section-kicker">AGENDA PERSONAL</span><h1>Mis clientes pendientes</h1><p class="muted">Todo lo que necesitas para acompañar cada servicio de principio a fin.</p></div></div><div class="filter-bar"><div class="search-field"><span>⌕</span><input id="clientSearch" type="search" placeholder="Buscar cliente o servicio" aria-label="Buscar clientes"></div><span id="clientCount" class="result-count">Cargando…</span></div><div id="list" class="specialist-grid" aria-live="polite"></div></main></div></div><div id="toast" class="toast" hidden></div>
  <script src="api.js?v=20260729"></script>
  <script>
    let clients=[];const normalize=value=>String(value).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();const escapeHtml=value=>String(value).replace(/[&<>'"]/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[char]));
    function notify(message){toast.textContent=message;toast.hidden=false;clearTimeout(notify.timer);notify.timer=setTimeout(()=>toast.hidden=true,2400)}
    function render(){const term=normalize(clientSearch.value);const rows=clients.filter(client=>normalize(`${client.nombre} ${client.servicios.map(service=>service.nombre).join(' ')}`).includes(term));clientCount.textContent=`${rows.length} ${rows.length===1?'cliente':'clientes'}`;
      list.innerHTML = rows.length ? rows.map(client => `
          <article class="card specialist-card"><span class="tag">Turno #${client.turno}</span><h2>${escapeHtml(client.nombre)}</h2>
          <p class="muted">${escapeHtml(client.observacion || 'Sin observaciones')}</p>
          ${client.servicios.filter(service => service.estado !== 'finalizado').map(service => `
            <div class="specialist-service ${service.estado==='reposo'?'service-resting':''}"><div><b>${escapeHtml(service.nombre)}</b><div class="muted">${service.estado==='reposo'?'Cliente en reposo':escapeHtml(service.estado.replace('_',' '))}</div></div>${service.staff_numero ? `<div class="service-actions">${service.estado==='reposo'?`<button class="secondary" onclick="transition(${client.id},${service.id},'resume')">Reanudar</button>`:`<button class="secondary" onclick="transition(${client.id},${service.id},'rest')">Poner en reposo</button><button onclick="finish(${client.id},${service.id})">Finalizar</button>`}</div>` : ''}</div>`).join('')}
          </article>`).join('') : `<section class="card empty-state"><span class="tag">Todo al día</span><h2>${term?'No encontramos coincidencias':'No tienes clientes pendientes'}</h2><p class="muted">${term?'Prueba con otro cliente o servicio.':'Los nuevos servicios asignados aparecerán aquí automáticamente.'}</p></section>`;}
    clientSearch.oninput=render;
    async function load() {
      try {
        clients = await api('/queue/specialist/mine');render();
      } catch (error) { list.textContent = error.message; }
    }

    async function finish(clientId, serviceId) {
      try {
        await api(`/queue/${clientId}/services/${serviceId}/finish`, {method: 'POST'});
        notify('Servicio finalizado correctamente');await load();
      } catch (error) { alert(error.message); }
    }

    async function transition(clientId,serviceId,action){
      try{await api(`/queue/${clientId}/services/${serviceId}/${action}`,{method:'POST'});notify(action==='rest'?'Cliente en reposo; puedes atender otra persona.':'Servicio reanudado.');await load()}catch(error){alert(error.message)}
    }

    load();
    setInterval(load, 10000);
  </script>
</body>
</html>
