<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Acceso · Mundo del Cabello</title><link rel="stylesheet" href="styles.css?v=20260724"></head><body class="modern-page"><header><a class="brand" href="checkin.html" style="color:inherit;text-decoration:none">Mundo del Cabello</a><nav class="site-nav" aria-label="Navegación principal"><a href="checkin.html">Check-in</a><a href="queue.html">Cola pública</a></nav></header><main class="public-shell"><div class="public-hero"><div class="public-copy"><span class="section-kicker">ESPACIO DEL EQUIPO</span><h1>Bienvenido<br>de vuelta.</h1><p>Accede a tu espacio de trabajo para acompañar cada turno con calma, claridad y la atención que nos distingue.</p></div><section class="card" style="padding:28px"><span class="section-kicker">ACCESO SEGURO</span><h2>Entrar al sistema</h2><p class="muted">Selecciona tu perfil e ingresa tus datos.</p><form id="form"><label>Tipo de usuario<select id="role"><option value="admin">Administrador</option><option value="especialista">Especialista</option></select></label><label id="user-label">Usuario<input id="username" required autocomplete="username"></label><label id="pass-label">Contraseña<input id="password" type="password" required autocomplete="current-password"></label><button class="pink-button" style="width:100%;margin-top:9px">Entrar al panel →</button><p id="error" class="selection-error" aria-live="polite"></p></form></section></div></main><script src="api.js?v=20260724"></script><script>role.onchange=()=>{document.querySelector('#user-label').firstChild.textContent=role.value==='admin'?'Usuario':'Número de especialista';document.querySelector('#pass-label').firstChild.textContent=role.value==='admin'?'Contraseña':'Cédula'};form.onsubmit=async e=>{e.preventDefault();error.textContent='Verificando…';try{const x=await api('/auth/login',{method:'POST',body:JSON.stringify({role:role.value,username:username.value,password:password.value})});localStorage.setItem('peluq_token',x.access_token);localStorage.setItem('peluq_role',x.role);location.href=x.role==='admin'?'admin.html':'specialist.html'}catch(x){error.textContent=x.message}};</script></body></html>
