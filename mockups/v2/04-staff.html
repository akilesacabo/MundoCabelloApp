<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Gestión de Personal · El Mundo del Cabello</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="app.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,1,0&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="app.css" />
  <script src="../data.js"></script>
  <script src="store.js"></script>
</head>
<body>
  <header class="glass sticky top-0 z-20" style="border-radius:0">
    <div class="max-w-7xl mx-auto px-6 py-3.5 flex items-center gap-4">
      <a href="index.html" class="flex items-center gap-2.5">
        <div class="avatar w-9 h-9" style="background:linear-gradient(135deg,#c14f98,#6f2955)">EM</div>
        <p class="font-display text-ink hidden sm:block">Gestión de Personal</p>
      </a>
      <a href="02-panel.html" class="btn-ghost text-sm ml-auto flex items-center gap-1"><span class="material-symbols-rounded text-base">arrow_back</span> Panel</a>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-6 py-8">
    <div class="flex flex-wrap items-end justify-between gap-4">
      <div>
        <h1 class="font-display text-4xl text-ink">Nuestro equipo</h1>
        <p id="counts" class="text-muted mt-1"></p>
      </div>
      <div class="relative">
        <span class="material-symbols-rounded absolute left-3 top-1/2 -translate-y-1/2 text-muted text-[20px]">search</span>
        <input id="q" class="input pl-10" style="min-width:260px" placeholder="Buscar por nombre o cédula…" />
      </div>
    </div>

    <!-- Filters -->
    <div class="flex flex-wrap items-center gap-2 mt-6">
      <div id="areaFilters" class="flex flex-wrap gap-2"></div>
      <span class="w-px h-6 bg-line mx-1 hidden sm:block"></span>
      <div id="statusFilters" class="flex flex-wrap gap-2"></div>
    </div>

    <div id="grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4 mt-6"></div>
  </main>

  <script>
    const D = window.DEMO_DATA;
    const Store = window.PeluqStore;
    const filters = { area: new URLSearchParams(location.search).get('area') || 'all', status: 'all', q: '' };

    document.getElementById('areaFilters').innerHTML = [
      `<button class="chip" data-area="all">Todas las áreas</button>`,
      ...D.areas.map(a => `<button class="chip" data-area="${a.key}"><span class="dot" style="background:${V2.areaColor[a.key]}"></span>${a.name}</button>`),
    ].join('');
    document.getElementById('statusFilters').innerHTML = [
      ['all', 'Todos', '#7c6f83'], ['DISPONIBLE', 'Disponible', '#4fbf8f'], ['OCUPADO', 'Ocupado', '#e26fae'], ['BREAK', 'Break', '#e6a93d'], ['PRUEBA', 'En prueba', '#b97f28'],
    ].map(([k, l, c]) => `<button class="chip" data-status="${k}">${k!=='all'?`<span class="dot" style="background:${c}"></span>`:''}${l}</button>`).join('');

    function syncActive() {
      document.querySelectorAll('[data-area]').forEach(b => b.dataset.on = b.dataset.area === filters.area ? '1' : '0');
      document.querySelectorAll('[data-status]').forEach(b => b.dataset.on = b.dataset.status === filters.status ? '1' : '0');
    }

    function render() {
      const s = Store.get();
      const list = s.staff.filter(st => {
        if (filters.area !== 'all' && !st.areas.includes(filters.area)) return false;
        if (filters.status === 'PRUEBA') { if (!st.en_prueba) return false; }
        else if (filters.status !== 'all' && st.status !== filters.status) return false;
        if (filters.q) {
          const q = filters.q.toLowerCase();
          if (!st.nombre.toLowerCase().includes(q) && !(st.cedula || '').toLowerCase().includes(q) && !String(st.numero).includes(q)) return false;
        }
        return true;
      });

      const total = s.staff.length;
      const disp = s.staff.filter(x => x.status === 'DISPONIBLE').length;
      const ocu = s.staff.filter(x => x.status === 'OCUPADO').length;
      const br = s.staff.filter(x => x.status === 'BREAK').length;
      document.getElementById('counts').textContent =
        `${total} profesionales · ${disp} disponibles · ${ocu} ocupados · ${br} en break · mostrando ${list.length}`;

      const grid = document.getElementById('grid');
      if (list.length === 0) {
        grid.innerHTML = `<div class="col-span-full text-center py-16">
          <span class="material-symbols-rounded text-5xl text-brand-200">search_off</span>
          <p class="text-muted mt-2">Ningún profesional coincide con los filtros.</p></div>`;
        return;
      }

      grid.innerHTML = list.map(st => {
        const sc = V2.statusColor[st.status];
        const busy = st.status === 'OCUPADO';
        const areasChips = st.areas.map(k => {
          const a = D.areas.find(x => x.key === k);
          return `<span class="pill" style="background:${V2.areaSoft[k]};color:${V2.areaColor[k]}"><span class="dot" style="background:${V2.areaColor[k]}"></span>${a.name}</span>`;
        }).join('');
        // Toggles de disponibilidad manual (Ocupado es automático al atender).
        const availBtns = busy
          ? `<span class="flex-1 text-[11px] font-semibold py-1.5 rounded-full text-center text-white" style="background:${V2.statusColor.OCUPADO}">Atendiendo${st.activos.length>1?` · ${st.activos.length}`:''}</span>`
          : ['DISPONIBLE','BREAK'].map(stt => `
              <button class="flex-1 text-[11px] font-semibold py-1.5 rounded-full border transition"
                data-set="${st.numero}" data-status-val="${stt}"
                style="${st.status===stt ? `background:${V2.statusColor[stt]};color:#fff;border-color:transparent` : 'background:#fff;color:#7c6f83;border-color:#ecdcec'}">
                ${stt==='DISPONIBLE'?'Libre':'Break'}
              </button>`).join('');
        return `<div class="card p-5 fade-up">
          <div class="flex items-center gap-3">
            <div class="relative">
              <div class="avatar w-12 h-12" style="background:${V2.areaColor[st.areas[0]]}">${st.initials}</div>
              <span class="absolute -bottom-0.5 -right-0.5 w-3.5 h-3.5 rounded-full border-2 border-white" style="background:${sc}"></span>
            </div>
            <div class="min-w-0 flex-1">
              <p class="font-semibold text-ink truncate">${V2.escape(st.alias)} <span class="text-xs text-muted font-normal">#${st.numero}</span></p>
              <p class="text-xs text-muted truncate">${V2.escape(st.nombre)}</p>
            </div>
            ${st.en_prueba ? `<span class="pill" style="background:#fbf1dd;color:#b97f28"><span class="material-symbols-rounded text-[13px]">school</span>En prueba</span>` : ''}
          </div>
          <div class="flex items-center gap-1.5 mt-3 flex-wrap text-xs text-muted">
            ${areasChips}
          </div>
          <p class="text-xs text-muted mt-2">${st.cedula || '—'}</p>
          <div class="flex gap-1.5 mt-4">${availBtns}</div>
          <button class="w-full mt-2 text-[11px] font-medium py-1.5 rounded-full border border-dashed transition ${st.en_prueba ? 'text-amber-700 border-amber-300' : 'text-muted border-line hover:border-brand-300'}" data-prueba="${st.numero}">
            ${st.en_prueba ? 'Quitar marca «En prueba»' : 'Marcar «En prueba»'}
          </button>
        </div>`;
      }).join('');
    }

    document.addEventListener('click', e => {
      const a = e.target.closest('[data-area]');
      if (a) { filters.area = a.dataset.area; syncActive(); render(); return; }
      const s = e.target.closest('[data-status]');
      if (s) { filters.status = s.dataset.status; syncActive(); render(); return; }
      const set = e.target.closest('[data-set]');
      if (set) { Store.setStaffManualStatus(Number(set.dataset.set), set.dataset.statusVal); return; }
      const pr = e.target.closest('[data-prueba]');
      if (pr) { Store.toggleEnPrueba(Number(pr.dataset.prueba)); return; }
    });
    document.getElementById('q').addEventListener('input', e => { filters.q = e.target.value.trim(); render(); });

    Store.onChange(render);
    syncActive();
    render();
  </script>
</body>
</html>
